<!DOCTYPE html>
<html>
<head>
    
    <title>household</title>
    <style>
        body {
            background-color: black;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
      
        form {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f9f9f9;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
    
        h1 {
            text-align: center;
            color: white;
            font-size: 2.5em;
            line-height: 1.2;
            margin: 0;
            padding: 0;
        }
    
        h2 {
            text-align: center;
            color: #333;
            font-size: 30px;
        }
    
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            display: inline-block;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
    
        button {
            width: 100%;
            background-color: #333;
            color: white;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    
        button:hover {
            background-color: black;
        }
    
        p {
            text-align: center;
            margin-top: 10px;
        }
    
        a {
            color: #0066cc;
            text-decoration: none;
        }
    
        a:hover {
            text-decoration: underline;
        }
    
        @media (max-width: 768px) {
            form {
                padding: 15px;
            }
    
            h2 {
                font-size: 22px;
            }
    
            input[type="text"], input[type="password"], button {
                padding: 8px;
            }
        }
    
        @media (max-width: 480px) {
            form {
                padding: 10px;
            }
    
            h2 {
                font-size: 20px;
            }
    
            input[type="text"], input[type="password"], button {
                padding: 6px;
            }
        }
    </style>
</head>
<body>
  <div>
        {% block content %}
        
        {% endblock %}
    </div>
</body>
</html>
